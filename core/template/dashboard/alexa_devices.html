<div class="eqLogic eqLogic-widget alexa-widget #custom_layout# #eqLogic_class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width: #width#;height: #height#;#style#">
    <center class="widget-name">
        <span class="warning" title="#alert_name#">
            <i class='#alert_icon#'></i>
        </span>
        <span class="cmd refresh pull-right cursor" data-cmd_id="#refresh_id#">
            <i class="fas fa-sync"></i>
        </span>
        <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
        <a href="#eqLogic_href#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
    </center>

    <div class="alexa-card-content">
        <!-- CABECERA CON ESTADO Y DND -->
        <div class="alexa-header-row">
            <div class="alexa-status-badge">
                #status_display#
            </div>
            <div class="alexa-dnd-toggle">
                #dnd_display#
            </div>
        </div>

        <!-- REPRODUCTOR MULTIMEDIA -->
        <div class="alexa-media-section">
            <div class="alexa-media-info">
                <i class="fas fa-music alexa-music-icon"></i>
                <span class="alexa-media-state">#media_state#</span>
            </div>
            <div class="alexa-media-controls">
                <button type="button" class="btn btn-default btn-circle btn-sm cmd-btn-alexa" data-cmd_id="#previous_id#" title="{{Previous}}">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button type="button" class="btn btn-primary btn-circle cmd-btn-alexa" data-cmd_id="#play_id#" title="{{Play}}">
                    <i class="fas fa-play"></i>
                </button>
                <button type="button" class="btn btn-default btn-circle cmd-btn-alexa" data-cmd_id="#pause_id#" title="{{Pause}}">
                    <i class="fas fa-pause"></i>
                </button>
                <button type="button" class="btn btn-default btn-circle btn-sm cmd-btn-alexa" data-cmd_id="#next_id#" title="{{Next}}">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
        </div>

        <!-- CONTROL DE VOLUMEN -->
        <div class="alexa-volume-row">
            <i class="fas fa-volume-down alexa-vol-icon"></i>
            <input type="range" class="alexa-vol-slider" min="0" max="100" value="#volume#" data-cmd_id="#set_volume_id#" />
            <i class="fas fa-volume-up alexa-vol-icon"></i>
            <span class="alexa-vol-val">#volume#%</span>
        </div>

        <!-- ÚLTIMO COMANDO VOCAL ESCUCHADO -->
        <div class="alexa-last-cmd-bubble" title="{{Last command heard by Alexa}}">
            <i class="fas fa-comment-dots" style="color: #00CAFA; margin-right: 4px;"></i>
            <span class="alexa-last-cmd-text">#last_command#</span>
        </div>

        <!-- EJECUTAR CUALQUIER COMANDO DEL DISPOSITIVO -->
        <div class="alexa-quick-action-row">
            <div style="display: flex; gap: 4px; align-items: center;">
                <select class="form-control input-sm alexa-widget-cmd-select" style="flex: 1;" title="{{Select command}}">
                    #cmd_options#
                </select>
                <a href="#eqLogic_href#" class="btn btn-xs btn-default alexa-btn-help-link reportModeHidden" title="{{Command help & configuration}}">
                    <i class="fas fa-question-circle"></i>
                </a>
            </div>
            <div class="input-group input-group-sm" style="margin-top: 4px;">
                <input type="text" class="form-control alexa-input-text" placeholder="{{Text to speak (SSML supported)...}}" />
                <input type="number" class="form-control alexa-input-slider" min="0" max="100" value="#volume#" style="display: none;" />
                <div class="input-group-btn">
                    <button type="button" class="btn btn-info alexa-btn-run-selected" title="{{Execute command}}">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ESTILOS Y COMPORTAMIENTO DEL WIDGET -->
    <style>
        .alexa-widget {
            background: linear-gradient(145deg, rgba(35, 47, 62, 0.95), rgba(20, 28, 38, 0.98)) !important;
            border-radius: 12px !important;
            border-top: 3px solid #00CAFA !important;
            color: #E6E6E6 !important;
            padding: 8px 12px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        }
        .alexa-card-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }
        .alexa-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alexa-media-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }
        .alexa-media-info {
            font-size: 11px;
            margin-bottom: 5px;
            color: #99B2C6;
        }
        .alexa-media-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .cmd-btn-alexa {
            border-radius: 50% !important;
            width: 32px;
            height: 32px;
            padding: 0 !important;
            line-height: 32px !important;
        }
        .cmd-btn-alexa.btn-primary {
            background-color: #00CAFA !important;
            border-color: #00CAFA !important;
            color: #111 !important;
            width: 36px;
            height: 36px;
            line-height: 36px !important;
        }
        .alexa-volume-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .alexa-vol-slider {
            flex-grow: 1;
            height: 4px;
            accent-color: #00CAFA;
            cursor: pointer;
        }
        .alexa-vol-val {
            min-width: 34px;
            text-align: right;
            font-weight: bold;
            color: #00CAFA;
        }
        .alexa-last-cmd-bubble {
            background: rgba(0, 202, 250, 0.1);
            border-left: 2px solid #00CAFA;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #BBEAFB;
        }
        .alexa-quick-action-row .alexa-widget-cmd-select {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #FFF !important;
            border-radius: 4px !important;
            font-size: 11px !important;
            height: 26px !important;
            padding: 2px 6px !important;
        }
        .alexa-quick-action-row .alexa-widget-cmd-select option {
            background: #1b2430;
            color: #FFF;
        }
        .alexa-quick-action-row .alexa-btn-help-link {
            background: rgba(0, 202, 250, 0.14) !important;
            border: 1px solid rgba(0, 202, 250, 0.35) !important;
            color: #00CAFA !important;
            height: 26px;
            line-height: 22px;
            padding: 1px 7px;
            border-radius: 4px !important;
        }
        .alexa-quick-action-row .alexa-btn-help-link:hover {
            background: rgba(0, 202, 250, 0.28) !important;
            color: #FFF !important;
        }
        .alexa-quick-action-row .form-control.alexa-input-text,
        .alexa-quick-action-row .form-control.alexa-input-slider {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #FFF !important;
            border-radius: 4px 0 0 4px !important;
        }
    </style>

    <script>
        (function() {
            var $widget = $('.alexa-widget[data-eqLogic_id=#id#]');

            function syncAlexaWidgetCmdInput() {
                var $opt = $widget.find('.alexa-widget-cmd-select option:selected');
                var sub = $opt.attr('data-subtype') || 'other';
                var ph = $opt.attr('data-placeholder') || '';
                var $txt = $widget.find('.alexa-input-text');
                var $sld = $widget.find('.alexa-input-slider');
                $txt.hide();
                $sld.hide();
                if (sub === 'message') {
                    $txt.attr('placeholder', ph).show();
                } else if (sub === 'slider') {
                    $sld.show();
                }
            }

            syncAlexaWidgetCmdInput();

            $widget.find('.alexa-widget-cmd-select').off('change').on('change', function() {
                syncAlexaWidgetCmdInput();
            });

            // Manejador de botones multimedia
            $widget.find('.cmd-btn-alexa').off('click').on('click', function() {
                var cmdId = $(this).attr('data-cmd_id');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId});
                }
            });

            // Manejador del slider de volumen
            $widget.find('.alexa-vol-slider').off('change').on('change', function() {
                var cmdId = $(this).attr('data-cmd_id');
                var val = $(this).val();
                $(this).siblings('.alexa-vol-val').text(val + '%');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId, value: {slider: val}});
                }
            });

            function runSelectedWidgetCmd() {
                var $opt = $widget.find('.alexa-widget-cmd-select option:selected');
                var cmdId = $opt.val();
                var sub = $opt.attr('data-subtype') || 'other';
                if (!cmdId) return;
                if (sub === 'message') {
                    var $txt = $widget.find('.alexa-input-text');
                    var text = $txt.val().trim();
                    if (!text) return;
                    jeedom.cmd.execute({id: cmdId, value: {title: '', message: text}});
                    $txt.val('');
                } else if (sub === 'slider') {
                    var sVal = $widget.find('.alexa-input-slider').val();
                    jeedom.cmd.execute({id: cmdId, value: {slider: sVal}});
                } else {
                    jeedom.cmd.execute({id: cmdId});
                }
            }

            $widget.find('.alexa-btn-run-selected').off('click').on('click', runSelectedWidgetCmd);
            $widget.find('.alexa-input-text').off('keypress').on('keypress', function(e) {
                if (e.which === 13) {
                    e.preventDefault();
                    runSelectedWidgetCmd();
                }
            });
        })();
    </script>
</div>
