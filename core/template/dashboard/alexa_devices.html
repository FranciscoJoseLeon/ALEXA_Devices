<div class="eqLogic eqLogic-widget alexa-widget #custom_layout# #eqLogic_class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width: #width#;height: #height#;#style#">
    <center class="widget-name">
        <span class="warning" title="#alert_name#">
            <i class='#alert_icon#'></i>
        </span>
        <span class="cmd refresh pull-right cursor" data-cmd_id="#refresh_id#">
            <i class="fas fa-sync"></i>
        </span>
        <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
        <a href="#eqLogic_href#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
    </center>

    <div class="alexa-card-content">
        <!-- MONITOR DE CALIDAD DEL AIRE (DEDICADO) -->
        #aqm_display#

        <!-- CONTROLES ESTÁNDAR ECHO / ALTAVOZ (CONDICIONALES SEGÚN CAPACIDADES) -->
        #header_row#
        #sensors_display#
        #media_section#
        #volume_section#
        #last_command_section#
        #quick_actions_section#
    </div>

    <!-- ESTILOS Y COMPORTAMIENTO DEL WIDGET -->
    <style>
        .alexa-widget {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.98)) !important;
            border-radius: 12px !important;
            border-top: 3px solid #00CAFA !important;
            color: #E2E8F0 !important;
            padding: 8px 12px !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }
        .alexa-card-content {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 5px;
        }
        .alexa-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* BADGES DE ESTADO GENERAL */
        .alexa-badge-status {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .alexa-badge-status.online {
            background: rgba(16, 185, 129, 0.18);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        .alexa-badge-status.offline {
            background: rgba(239, 68, 68, 0.18);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        /* SENSORES ECHO GENÉRICOS */
        .alexa-sensors-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 2px 0;
        }
        .alexa-sensor-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 10.5px;
            color: #CBD5E1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .alexa-sensor-pill i {
            color: #00CAFA;
        }

        /* REPRODUCTOR MULTIMEDIA ECHO */
        .alexa-media-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }
        .alexa-media-info {
            font-size: 11px;
            margin-bottom: 5px;
            color: #94A3B8;
        }
        .alexa-media-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .cmd-btn-alexa {
            border-radius: 50% !important;
            width: 32px;
            height: 32px;
            padding: 0 !important;
            line-height: 32px !important;
        }
        .cmd-btn-alexa.btn-primary {
            background-color: #00CAFA !important;
            border-color: #00CAFA !important;
            color: #0F172A !important;
            width: 36px;
            height: 36px;
            line-height: 36px !important;
        }

        /* VOLUMEN */
        .alexa-volume-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .alexa-vol-slider {
            flex-grow: 1;
            height: 4px;
            accent-color: #00CAFA;
            cursor: pointer;
        }
        .alexa-vol-val {
            min-width: 34px;
            text-align: right;
            font-weight: bold;
            color: #00CAFA;
        }

        /* BURBUJA ÚLTIMO COMANDO VOCAL */
        .alexa-last-cmd-bubble {
            background: rgba(0, 202, 250, 0.08);
            border-left: 2px solid #00CAFA;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #BAE6FD;
        }

        /* ACCIONES RÁPIDAS */
        .alexa-quick-action-row .alexa-widget-cmd-select {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #FFF !important;
            border-radius: 4px !important;
            font-size: 11px !important;
            height: 26px !important;
            padding: 2px 6px !important;
        }
        .alexa-quick-action-row .alexa-widget-cmd-select option {
            background: #1b2430;
            color: #FFF;
        }
        .alexa-quick-action-row .alexa-btn-help-link {
            background: rgba(0, 202, 250, 0.14) !important;
            border: 1px solid rgba(0, 202, 250, 0.35) !important;
            color: #00CAFA !important;
            height: 26px;
            line-height: 22px;
            padding: 1px 7px;
            border-radius: 4px !important;
        }
        .alexa-quick-action-row .alexa-btn-help-link:hover {
            background: rgba(0, 202, 250, 0.28) !important;
            color: #FFF !important;
        }
        .alexa-quick-action-row .form-control.alexa-input-text,
        .alexa-quick-action-row .form-control.alexa-input-select,
        .alexa-quick-action-row .form-control.alexa-input-slider {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #FFF !important;
            border-radius: 4px 0 0 4px !important;
        }
        .alexa-quick-action-row .form-control.alexa-input-select option {
            background: #1b2430;
            color: #FFF;
        }

        /* ==============================================================
           ESTILOS DEDICADOS: MONITOR DE CALIDAD DEL AIRE (AQM)
           ============================================================== */
        .alexa-aqm-container {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .alexa-aqm-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .alexa-aqm-led-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94A3B8;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .alexa-aqm-led-pill.on {
            color: #38BDF8;
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.12);
        }

        /* HERO CARD (ÍNDICE DE CALIDAD) */
        .alexa-aqm-hero {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            background: radial-gradient(circle at 25% 50%, rgba(var(--aqm-color-rgb), 0.18), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(var(--aqm-color-rgb), 0.35);
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }
        .alexa-aqm-hero-circle {
            min-width: 50px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--aqm-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 14px rgba(var(--aqm-color-rgb), 0.4);
            background: rgba(0, 0, 0, 0.35);
        }
        .alexa-aqm-hero-num {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1;
        }
        .alexa-aqm-hero-denom {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1;
            margin-top: 1px;
        }
        .alexa-aqm-hero-text {
            flex: 1;
            min-width: 0;
        }
        .alexa-aqm-hero-label {
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94A3B8;
            font-weight: 600;
        }
        .alexa-aqm-hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 700;
            color: var(--aqm-color);
            margin: 2px 0;
        }
        .alexa-aqm-hero-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--aqm-color);
            box-shadow: 0 0 6px var(--aqm-color);
        }
        .alexa-aqm-hero-desc {
            font-size: 10.5px;
            color: #CBD5E1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BARRA GRADIENTE DEL ÍNDICE */
        .alexa-aqm-gauge-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin: -1px 0 2px 0;
        }
        .alexa-aqm-gauge-fill {
            height: 100%;
            border-radius: 2px;
            background: var(--aqm-color);
            box-shadow: 0 0 8px var(--aqm-color);
            transition: width 0.4s ease;
        }

        /* GRID DE MÉTRICAS INDIVIDUALES */
        .alexa-aqm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .alexa-aqm-metric-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .alexa-aqm-metric-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .alexa-aqm-metric-header {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #94A3B8;
            font-weight: 500;
        }
        .alexa-aqm-metric-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .alexa-aqm-metric-val-row {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin: 1px 0;
        }
        .alexa-aqm-metric-val {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.1;
        }
        .alexa-aqm-metric-unit {
            font-size: 10.5px;
            font-weight: 500;
            color: #94A3B8;
        }
        .alexa-aqm-metric-eval {
            font-size: 9.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .alexa-aqm-eval-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .alexa-aqm-extra-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }
        .alexa-aqm-extra-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 9.5px;
            color: #CBD5E1;
        }
    </style>

    <script>
        (function() {
            var $widget = $('.alexa-widget[data-eqLogic_id=#id#]');

            function syncAlexaWidgetCmdInput() {
                var $sel = $widget.find('.alexa-widget-cmd-select');
                if (!$sel.length) return;
                var $opt = $sel.find('option:selected');
                if (!$opt.length) return;

                var sub = $opt.attr('data-subtype') || 'other';
                var ph = $opt.attr('data-placeholder') || '';
                var optsRaw = $opt.attr('data-options') || '';
                var $txt = $widget.find('.alexa-input-text');
                var $selOpt = $widget.find('.alexa-input-select');
                var $sld = $widget.find('.alexa-input-slider');
                $txt.hide();
                $selOpt.hide().empty();
                $sld.hide();

                if (optsRaw) {
                    try {
                        var parsed = JSON.parse(optsRaw);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            parsed.forEach(function(item) {
                                $selOpt.append($('<option></option>').val(item.value).text(item.label));
                            });
                            $selOpt.show();
                            return;
                        }
                    } catch (e) {}
                }

                if (sub === 'message') {
                    $txt.attr('placeholder', ph).show();
                } else if (sub === 'slider') {
                    $sld.show();
                }
            }

            syncAlexaWidgetCmdInput();

            $widget.find('.alexa-widget-cmd-select').off('change').on('change', function() {
                syncAlexaWidgetCmdInput();
            });

            // Manejador de botones multimedia
            $widget.find('.cmd-btn-alexa').off('click').on('click', function() {
                var cmdId = $(this).attr('data-cmd_id');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId});
                }
            });

            // Manejador del slider de volumen
            $widget.find('.alexa-vol-slider').off('change').on('change', function() {
                var cmdId = $(this).attr('data-cmd_id');
                var val = $(this).val();
                $(this).siblings('.alexa-vol-val').text(val + '%');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId, value: {slider: val}});
                }
            });

            function runSelectedWidgetCmd() {
                var $sel = $widget.find('.alexa-widget-cmd-select');
                if (!$sel.length) return;
                var $opt = $sel.find('option:selected');
                var cmdId = $opt.val();
                var sub = $opt.attr('data-subtype') || 'other';
                if (!cmdId) return;
                var $selOpt = $widget.find('.alexa-input-select');
                if ($selOpt.is(':visible')) {
                    var optVal = $selOpt.val();
                    if (!optVal) return;
                    if (sub === 'select') {
                        jeedom.cmd.execute({id: cmdId, value: {select: optVal}});
                    } else {
                        jeedom.cmd.execute({id: cmdId, value: {title: '', message: optVal}});
                    }
                } else if (sub === 'message') {
                    var $txt = $widget.find('.alexa-input-text');
                    var text = $txt.val().trim();
                    if (!text) return;
                    jeedom.cmd.execute({id: cmdId, value: {title: '', message: text}});
                    $txt.val('');
                } else if (sub === 'slider') {
                    var sVal = $widget.find('.alexa-input-slider').val();
                    jeedom.cmd.execute({id: cmdId, value: {slider: sVal}});
                } else {
                    jeedom.cmd.execute({id: cmdId});
                }
            }

            $widget.find('.alexa-btn-run-selected').off('click').on('click', runSelectedWidgetCmd);
            $widget.find('.alexa-input-text').off('keypress').on('keypress', function(e) {
                if (e.which === 13) {
                    e.preventDefault();
                    runSelectedWidgetCmd();
                }
            });
        })();
    </script>
</div>
