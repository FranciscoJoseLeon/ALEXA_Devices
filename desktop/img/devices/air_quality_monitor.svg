<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="aqmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#00E676" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aqmBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="aqmRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="aqmVent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Base Soft Shadow -->
  <ellipse cx="48" cy="85" rx="26" ry="6" fill="#000000" opacity="0.32"/>

  <!-- Cube Main Body -->
  <rect x="22" y="18" width="52" height="58" rx="14" fill="url(#aqmBody)"/>
  <rect x="22" y="18" width="52" height="58" rx="14" fill="none" stroke="url(#aqmRim)" stroke-width="1.2"/>

  <!-- Front Inset Panel -->
  <rect x="26" y="22" width="44" height="50" rx="10" fill="#FFFFFF" opacity="0.65"/>

  <!-- Top Intake Air Vents -->
  <rect x="34" y="29" width="28" height="2" rx="1" fill="url(#aqmVent)" opacity="0.45"/>
  <rect x="36" y="34" width="24" height="2" rx="1" fill="url(#aqmVent)" opacity="0.45"/>
  <rect x="38" y="39" width="20" height="2" rx="1" fill="url(#aqmVent)" opacity="0.45"/>

  <!-- Iconic Center Air Quality LED Indicator -->
  <circle cx="48" cy="51" r="10" fill="url(#aqmGlow)"/>
  <circle cx="48" cy="51" r="4.2" fill="#00E676"/>
  <circle cx="48" cy="51" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Bottom Vent Slot -->
  <rect x="36" y="63" width="24" height="2" rx="1" fill="url(#aqmVent)" opacity="0.35"/>
</svg>
