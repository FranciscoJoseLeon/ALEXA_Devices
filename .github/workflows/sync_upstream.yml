name: Alerta Desarrollador - Novedades Home Assistant

on:
  schedule:
    # Se ejecuta todos los lunes a las 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permite ejecutar la comprobación manualmente cuando quieras

jobs:
  check-ha-updates:
    name: Comprobar cambios en HA Core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analizar cambios en Home Assistant
        id: checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sync_from_ha.py

      - name: Crear Issue de aviso para el Desarrollador
        if: steps.checker.outputs.changes_detected == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔔 [HA Upstream] Novedades detectadas en alexa_devices (${{ steps.checker.outputs.ha_version }})"
          content-filepath: ./tools/last_report.md
          labels: |
            dev-alert
            upstream-sync
          assignees: ${{ github.repository_owner }}

      - name: Actualizar repositorio y crear PR con requirements.txt
        if: steps.checker.outputs.version_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): actualizar aioamazondevices a ${{ steps.checker.outputs.ha_version }}"
          title: "⬆️ Actualizar aioamazondevices a ${{ steps.checker.outputs.ha_version }} (HA Upstream)"
          body: |
            Se ha actualizado `resources/requirements.txt` con la nueva versión utilizada en Home Assistant Core.
            
            Revisa los cambios y fusiona cuando estés listo para publicar una nueva versión para los usuarios de Jeedom.
          branch: "auto-update-aioamazondevices"
          base: "main"

